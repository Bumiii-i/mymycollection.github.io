<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">Home</a> <span class="separator">|</span>
            <a href="collection.html">Collection</a> <span class="separator">|</span>
            <a href="contact.html">Contact</a> <span class="separator">|</span>
            <a href="about.html">About</a>
        </div>
        <div class="nav-auth">
            <a href="signin.html">Sign in</a> <span class="separator">|</span>
            <a href="signup.html">Sign up</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h1>Sign Up</h1>
            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                <button type="submit">Create Account</button>
                
                <p class="auth-switch">Already have an account? <a href="signin.html">Sign in here</a></p>
            </form>
        </div>
    </div>
</body>
</html>
